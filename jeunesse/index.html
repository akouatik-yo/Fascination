<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fascinations Labo</title>
<meta name="description" content="32 machines de science à toucher, pour les 10-14 ans : on joue, c'est beau, et l'envie de comprendre vient après.">
<meta name="theme-color" content="#05050a">
<!--build:css-->
<link rel="stylesheet" href="css/labo.css">
<!--/build:css-->
</head>
<body>
<!--build:body-->
<div id="fj">
  <canvas id="cv"></canvas>
  <nav class="col" id="colG" aria-label="Gestes">
    <button class="cb" id="bCarte" aria-label="La carte des machines"></button>
    <div id="gestes" role="toolbar" aria-label="Que fait ton doigt ?"></div>
    <div class="sep"></div>
    <button class="cb" id="bPause"></button>
  </nav>
  <nav class="col" id="colD" aria-label="Commandes">
    <button class="cb" id="bSon"></button>
    <div class="sep"></div>
    <button class="cb" id="bPourquoi"></button>
    <button class="cb" id="bBidouiller"></button>
    <button class="cb" id="bEncore" aria-label="Encore : la même machine, autrement"></button>
    <div class="sep"></div>
    <button class="cb" id="bPhoto"></button>
  </nav>
  <header id="haut">
    <div class="titre"><button class="fl" id="bPrec" aria-label="Machine précédente"></button><button id="nom" aria-label="Pourquoi ?"></button><button class="fl" id="bSuiv" aria-label="Machine suivante"></button></div>
    <div id="scenes" role="tablist" aria-label="Scènes"></div>
  </header>
  <div id="actions"></div>
  <div id="carton" hidden></div>
  <div id="bulle" hidden role="status"></div>
  <div id="pastille" hidden></div>
  <button id="remplir" hidden></button>
  <aside id="tiroir" hidden></aside>
  <section class="ecran" id="carte" hidden></section>
  <section class="ecran" id="carnet" hidden></section>
  <section class="ecran" id="parents" hidden></section>
  <button id="sortie" hidden aria-label="Quitter le spectacle"></button>
  <div id="main" hidden></div>
  <div id="flash" hidden></div>
  <div id="chargement">Les machines se réveillent…</div>
</div>
<!--/build:body-->
