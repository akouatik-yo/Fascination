<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fascinations</title>
<meta name="description" content="Vingt-six machines à fascination : simulations contemplatives à regarder, toucher et écouter.">
<meta name="theme-color" content="#07060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<!--build:css-->
<link rel="stylesheet" href="css/fascination.css">
<!--/build:css-->
</head>
<body>
<!--build:body-->
<div id="app">
  <header class="fh" id="chrome">
    <button class="hb menu" id="bLeft" title="Liste des machines ([)" aria-label="Liste des machines">☰</button>
    <div class="brand"><b>FASCINATIONS</b><span id="count">31 expériences · cabinet de curiosités animées</span></div>
    <div class="spacer"></div>
    <div class="hbar">
      <button class="hb sq" id="bPrev" title="Précédent (←)" aria-label="Machine précédente">‹</button>
      <button class="hb sq" id="bNext" title="Suivant (→)" aria-label="Machine suivante">›</button>
      <button class="hb" id="bShuffle" title="Au hasard (R)">HASARD</button>
      <button class="hb" id="bSound" title="Son des machines (S)">SON OFF</button>
      <button class="hb" id="bNoise" title="Générateur de bruits (N)">BRUITS</button>
      <button class="hb" id="bTheme" title="Thème : automatique, clair ou sombre (T)">◐ AUTO</button>
      <button class="hb" id="bPsy" title="Filtre psychédélique">PSYCHÉ ON</button>
      <div class="speed" title="Vitesse : faites rouler la molette du doigt (lentement : réglage fin ; vivement : grands pas) · double-touche : ×1">
        <span>VITESSE</span>
        <div class="wheel" id="wheel" role="slider" tabindex="0" aria-label="Vitesse de la simulation" aria-valuemin="0.05" aria-valuemax="8" aria-valuenow="1"><canvas id="wheelCv"></canvas></div>
        <output id="speedOut">×1</output>
      </div>
      <button class="hb" id="bPhoto" title="Prendre une photo de l’écran">PHOTO</button>
      <button class="hb" id="bPause" title="Pause (espace)">PAUSE</button>
      <button class="hb" id="bZen" title="Plein écran (H)">ZEN</button>
      <button class="hb on" id="bRight" title="Panneau de la machine (])">PANNEAU ◧</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="vignette"></div>
    <aside class="rail" id="rail" aria-label="Machines"></aside>
    <aside class="panel" id="panel" aria-label="Panneau de la machine"></aside>
    <button class="zenout" id="bZenOut" hidden>QUITTER LE ZEN</button>
    <div class="loading" id="loading">ÉVEIL DES MACHINES…</div>
  </main>
</div>
<!--/build:body-->
<!--build:js-->
<script src="js/fk.js"></script>
<script src="js/fkgl.js"></script>
<script src="js/fk-son.js"></script>
