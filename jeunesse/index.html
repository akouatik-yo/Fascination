<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fascinations</title>
<meta name="description" content="32 machines de science à toucher, de 5 ans à l’âge adulte : on joue, c’est beau, et l’envie de comprendre vient après.">
<meta name="theme-color" content="#05050a">
<!--build:css-->
<link rel="stylesheet" href="css/labo.css">
<!--/build:css-->
</head>
<body>
<!--build:body-->
<div id="fj">
  <canvas id="cv"></canvas>
  <!-- refonte de la navigation (13/11, chef-design) : plus de colonnes ; des grappes de boutons ronds dans les coins, à 24 px des bords -->
  <nav class="grappe" id="hg" aria-label="Aller ailleurs">
    <button class="cb" id="bCarte" aria-label="La carte des questions"></button>
    <button class="cb" id="bEncore" aria-label="Encore : la même machine, autrement"></button>
  </nav>
  <nav class="grappe" id="hd" aria-label="Commandes">
    <button class="cb" id="bJoueur" aria-label="Qui joue ?"></button>
    <button class="cb" id="bSon"></button>
    <button class="cb" id="bPause"></button>
    <button class="cb" id="bPhoto"></button>
  </nav>
  <nav class="grappe" id="bg" aria-label="Comprendre et bidouiller">
    <button class="cb" id="bPourquoi"></button>
    <button class="cb" id="bBidouiller"></button>
  </nav>
  <div class="grappe" id="gestes" role="toolbar" aria-label="Que fait ton doigt ?"></div>
  <header id="haut">
    <div class="titre"><button id="nom" aria-label="Pourquoi ?"></button><span id="titreEcoute"></span></div>
  </header>
  <nav id="scenes" aria-label="Le chemin de la question"></nav>
  <div id="actions"></div>
  <section id="fil" hidden aria-live="polite"></section>
  <div id="carton" hidden></div>
  <div id="bulle" hidden role="status"></div>
  <div id="pastille" hidden></div>
  <button id="remplir" hidden></button>
  <aside id="tiroir" hidden></aside>
  <section class="ecran" id="carte" hidden></section>
  <section class="ecran" id="carnet" hidden></section>
  <section class="ecran" id="parents" hidden></section>
  <section class="ecran accueil" id="accueil" hidden></section>
  <button id="sortie" hidden aria-label="Quitter le spectacle"></button>
  <div id="main" hidden></div>
  <div id="flash" hidden></div>
  <div id="chargement">Les machines se réveillent…</div>
</div>
<!--/build:body-->
