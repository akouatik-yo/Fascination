<title>Fascination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Fascination — coquille (HTML/CSS natif)
   Deux thèmes : sombre néon (par défaut) et clair crème. La coquille pose data-fasc-theme sur <html>
   (choix du visiteur, sinon thème de l'hôte, sinon préférence du système). */
:root {
  --bg: #07060c; --bg-deep: #06050b; --bg-top: #100b1c;
  --fg: #efe9f7; --fg-strong: #ffffff; --fg-soft: #cfc7de; --fg-2: #d3cbe0; --fg-3: #aca4bd; --fg-4: #8f87a2;
  --fg-mute: #8b839e; --fg-faint: #6f6885;
  --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .12); --line-hi: rgba(255, 255, 255, .3);
  --glass: rgba(9, 7, 14, .82); --head: rgba(10, 8, 16, .6); --pop: rgba(9, 7, 14, .9);
  --chip: rgba(255, 255, 255, .04); --chip-hi: rgba(255, 255, 255, .1); --chip-bd: rgba(255, 255, 255, .1); --chip-on: rgba(255, 255, 255, .09);
  --track: rgba(255, 255, 255, .07); --knob-off: rgba(255, 255, 255, .16); --scroll: rgba(255, 255, 255, .11);
  --b1: #ffb3f0; --b2: #a98bff; --b3: #6fe6ff;
  --violet: #c09aff; --rose: #ff8ad8; --rose-soft: #ffb8e6;
  --vignette: .55; --shadow: rgba(0, 0, 0, .55); --shot: rgba(5, 4, 9, .86);
  --sans: 'Space Grotesk', Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-fasc-theme="light"] {
  --bg: #f3eee3; --bg-deep: #efe9dc; --bg-top: #fbf7ee;
  --fg: #231c31; --fg-strong: #120c1f; --fg-soft: #3e3650; --fg-2: #3a3249; --fg-3: #5a5268; --fg-4: #6d6579;
  --fg-mute: #6e6680; --fg-faint: #8a8396;
  --line: rgba(45, 30, 80, .1); --line-2: rgba(45, 30, 80, .16); --line-hi: rgba(45, 30, 80, .38);
  --glass: rgba(250, 246, 238, .88); --head: rgba(250, 246, 238, .72); --pop: rgba(251, 248, 241, .95);
  --chip: rgba(45, 30, 80, .04); --chip-hi: rgba(45, 30, 80, .09); --chip-bd: rgba(45, 30, 80, .14); --chip-on: rgba(45, 30, 80, .07);
  --track: rgba(45, 30, 80, .1); --knob-off: rgba(45, 30, 80, .2); --scroll: rgba(45, 30, 80, .18);
  --b1: #c93a93; --b2: #6440cf; --b3: #1286b3;
  --violet: #6f45d4; --rose: #c2368f; --rose-soft: #a8307c;
  --vignette: .22; --shadow: rgba(60, 40, 20, .18); --shot: rgba(243, 238, 227, .9);
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg) }
body { font-family: var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
a { color: var(--violet); text-decoration: none }
button { font-family: inherit }
button:focus-visible, input:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px }
::-webkit-scrollbar { width: 9px }
::-webkit-scrollbar-track { background: transparent }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 9px }
@keyframes fbreathe { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
@keyframes fslide { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@keyframes fpop { from { opacity: 0; transform: translate(-50%, 8px) } to { opacity: 1; transform: translate(-50%, 0) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }

#app { display: flex; flex-direction: column; height: 100%; width: 100%; background: radial-gradient(120% 90% at 50% 0%, var(--bg-top) 0%, var(--bg) 60%); color: var(--fg) }

/* ── en-tête ── */
header.fh { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px; padding: 12px 18px; padding-top: max(12px, env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--head); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); flex: none }
.brand { display: flex; align-items: baseline; gap: 12px; flex: 0 1 auto; min-width: 0; max-width: 100% }
.brand b { font-size: 19px; font-weight: 700; letter-spacing: .26em; background: linear-gradient(96deg, var(--b1), var(--b2) 45%, var(--b3)); -webkit-background-clip: text; background-clip: text; color: transparent }
.brand span { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--fg-faint); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.spacer { flex: 1; min-width: 12px }
.hbar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center }
.hb { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--chip-bd); background: var(--chip); color: var(--fg-soft); cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; white-space: nowrap }
.hb:hover { background: var(--chip-hi) }
.hb.sq { width: 32px; padding: 0; font-family: var(--sans); font-size: 12px }
.hb.menu { width: 34px; padding: 0; font-family: var(--sans); font-size: 15px; line-height: 1; color: var(--fg); flex: none }
.hb.on { color: var(--fg-strong) }
.speed { display: flex; align-items: center; gap: 9px; padding: 0 11px; height: 30px; border-radius: 8px; border: 1px solid var(--chip-bd); background: var(--chip) }
.speed span { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--fg-mute) }
.speed output { font-family: var(--mono); font-size: 10px; color: var(--fg); width: 34px; text-align: right }
.speed input { width: 96px; height: 14px; accent-color: var(--violet); cursor: ew-resize; background: transparent }

/* ── scène ── */
main.stage { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg-deep) }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(115% 90% at 50% 45%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, var(--vignette)) 100%); mix-blend-mode: multiply }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; letter-spacing: .28em; color: var(--fg-mute); animation: fbreathe 2s ease-in-out infinite; pointer-events: none }
.zenout { position: absolute; right: 16px; top: max(16px, env(safe-area-inset-top, 0px)); padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--head); color: var(--fg-soft); cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; z-index: 6 }

/* ── volets ── */
aside.rail, aside.panel { position: absolute; top: 0; bottom: 0; z-index: 4; overflow-y: auto; overflow-x: hidden; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; flex-direction: column; overscroll-behavior: contain }
aside.rail { left: 0; width: min(262px, 84vw); padding: 14px 12px 26px; border-right: 1px solid var(--line-2); gap: 16px }
aside.panel { right: 0; width: min(330px, 90vw); padding: 18px 18px 34px; border-left: 1px solid var(--line-2); gap: 22px }
.grp { display: flex; flex-direction: column; gap: 5px }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 0 4px 4px }
.grp-h i { width: 5px; height: 5px; border-radius: 5px }
.grp-h span, .kicker { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-mute) }
.it { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--chip); color: var(--fg-soft); cursor: pointer; font-size: 13px; transition: background .15s, border-color .15s }
.it:hover { border-color: var(--line-hi) }
.it .g { width: 18px; flex: none; text-align: center; font-size: 13px; color: var(--fg-faint) }
.it .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 }
.it .t b { font-weight: 500 }
.it .t small { font-family: var(--mono); font-size: 9px; letter-spacing: .03em; color: var(--fg-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.it.on { background: var(--chip-on); color: var(--fg-strong) }
.keys { margin-top: auto; padding: 12px 6px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .06em; color: var(--fg-faint); line-height: 1.7 }

.p-head { display: flex; flex-direction: column; gap: 8px }
.p-title { display: flex; align-items: center; gap: 10px }
.p-title .g { font-size: 16px }
.p-title h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; margin: 0; text-wrap: balance }
.x { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--chip-bd); background: var(--chip); color: var(--fg-soft); cursor: pointer; font-size: 14px; flex: none }
.x:hover { background: var(--chip-hi) }
.p-blurb { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase }
.p-intro { font-size: 13px; line-height: 1.55; color: var(--fg-soft); text-wrap: pretty }
.sec { display: flex; flex-direction: column; gap: 9px }
.tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px }
.tl { padding: 8px 8px; border-radius: 9px; border: 1px solid var(--chip-bd); background: var(--chip); color: var(--fg-3); cursor: pointer; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; text-align: center }
.tl:hover { border-color: var(--line-hi) }
.tdesc { font-size: 12px; line-height: 1.5; color: var(--fg-3); text-wrap: pretty }
.row { display: flex; gap: 6px; flex-wrap: wrap }
.sb { flex: 1; min-width: 84px; height: 32px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--chip); color: var(--fg-2); cursor: pointer; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em }
.sb:hover { background: var(--chip-hi) }
.sb.play { background: var(--chip-on); color: var(--fg-strong) }
.note { font-size: 11.5px; line-height: 1.5; color: var(--fg-4); text-wrap: pretty }

.ctl { display: flex; flex-direction: column; gap: 11px }
.c-sec { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-mute); padding-top: 10px; margin-top: 2px; border-top: 1px solid var(--line) }
.c-bar { display: flex; flex-direction: column; gap: 4px }
.c-bar .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px }
.c-bar .h span:first-child { display: flex; align-items: center; gap: 7px; color: var(--fg-2); font-style: italic; min-width: 0 }
.c-bar .h i { width: 8px; height: 8px; border-radius: 8px; flex: none }
.c-bar .v { font-family: var(--mono); font-size: 10px; color: var(--fg-4); white-space: nowrap; font-variant-numeric: tabular-nums }
.c-bar .tr { height: 4px; border-radius: 4px; background: var(--track); overflow: hidden }
.c-bar .tr div { height: 100%; border-radius: 4px; transition: width .4s }
.c-sl { display: flex; flex-direction: column; gap: 4px }
.c-sl .h { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-2) }
.c-sl .h span:last-child { font-family: var(--mono); font-size: 10px; color: var(--fg); font-variant-numeric: tabular-nums; text-align: right }
.c-sl input { width: 100%; height: 16px; cursor: ew-resize; background: transparent }
.c-tg { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 2px 0; color: var(--fg-2); cursor: pointer; text-align: left; font-size: 12px; font-family: inherit }
.c-tg .tk { position: relative; width: 30px; height: 17px; border-radius: 17px; flex: none; background: var(--knob-off); transition: background .15s }
.c-tg .tk i { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 13px; background: #fff; transition: left .15s }
.c-tg span:last-child { flex: 1 }
.c-ch { display: flex; flex-direction: column; gap: 6px }
.c-ch > span { font-size: 12px; color: var(--fg-2) }
.c-ch .opts { display: flex; gap: 5px; flex-wrap: wrap }
.c-ch button { flex: 1; min-width: 70px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--chip-bd); background: var(--chip); color: var(--fg-3); cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .06em }
.c-bt { display: flex; gap: 6px; flex-wrap: wrap }
.c-bt button { flex: 1 1 auto; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--chip); color: var(--fg-2); cursor: pointer; font-size: 12px; font-family: inherit }
.c-bt button:hover { background: var(--chip-hi); border-color: var(--line-hi) }

.about { display: flex; flex-direction: column; gap: 12px; padding-top: 10px; border-top: 1px solid var(--line) }
.about > button { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-mute) }
.about > button span:last-child { font-size: 13px; color: var(--fg-soft) }
.about-body { display: flex; flex-direction: column; gap: 14px }
.lg { display: flex; gap: 10px; align-items: flex-start }
.lg > i { width: 10px; height: 10px; border-radius: 10px; flex: none; margin-top: 4px }
.lg > div { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.lg b { font-size: 13px; font-style: italic; font-weight: 500; color: var(--fg) }
.lg small { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase }
.lg span { font-size: 12px; line-height: 1.5; color: var(--fg-3); text-wrap: pretty }
.about-body p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--fg-soft); text-wrap: pretty }
.gestes { display: flex; flex-direction: column; gap: 4px }
.gestes span:last-child { font-size: 12px; line-height: 1.55; color: var(--fg-3); text-wrap: pretty }

/* ── photo ── */
.shot { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; background: var(--shot); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px) }
.shot img { max-width: 100%; max-height: calc(100% - 90px); border-radius: 10px; border: 1px solid var(--line-2); box-shadow: 0 20px 60px var(--shadow) }
.shot p { margin: 0; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--fg-3); text-align: center; text-transform: uppercase }

@media (max-width: 640px) {
  header.fh { padding: 10px 12px; gap: 8px 12px }
  .brand span { display: none }
  .speed input { width: 70px }
}

/* ── générateur de bruits ── */
aside.bruits { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5; width: min(400px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; overscroll-behavior: contain; padding: 16px 18px 22px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--pop); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 24px 70px var(--shadow); display: flex; flex-direction: column; gap: 12px; animation: fpop .25s ease-out both }
aside.bruits .p-title h1 { font-size: 20px }
aside.bruits .c-sec { display: flex; gap: 6px; align-items: baseline }
aside.bruits .c-sec .v { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--rose-soft); text-transform: none; font-variant-numeric: tabular-nums }
.spec { width: 100%; height: 75px; border-radius: 10px; background: var(--chip); border: 1px solid var(--line) }
.mix { display: flex; flex-direction: column; gap: 9px }
.mixrow { display: flex; gap: 10px; align-items: center }
.mixrow > i { width: 9px; height: 9px; border-radius: 9px; flex: none; margin-top: 2px }
.mixrow .c-sl { flex: 1; min-width: 0 }

</style>
<div id="app">
  <header class="fh" id="chrome">
    <button class="hb menu" id="bLeft" title="Liste des machines ([)" aria-label="Liste des machines">☰</button>
    <div class="brand"><b>FASCINATION</b><span id="count">26 expériences · cabinet de curiosités animées</span></div>
    <div class="spacer"></div>
    <div class="hbar">
      <button class="hb sq" id="bPrev" title="Précédent (←)" aria-label="Machine précédente">‹</button>
      <button class="hb sq" id="bNext" title="Suivant (→)" aria-label="Machine suivante">›</button>
      <button class="hb" id="bShuffle" title="Au hasard (R)">HASARD</button>
      <button class="hb" id="bSound" title="Son des machines (S)">SON OFF</button>
      <button class="hb" id="bNoise" title="Générateur de bruits (N)">BRUITS</button>
      <button class="hb" id="bTheme" title="Thème : automatique, clair ou sombre (T)">◐ AUTO</button>
      <button class="hb" id="bPsy" title="Filtre psychédélique">PSYCHÉ ON</button>
      <div class="speed">
        <span>VITESSE</span>
        <input type="range" id="speed" min="0.08" max="2.5" step="0.02" value="1" title="Vitesse de la simulation" aria-label="Vitesse de la simulation">
        <output id="speedOut">×1</output>
      </div>
      <button class="hb" id="bPhoto" title="Prendre une photo de l’écran">PHOTO</button>
      <button class="hb" id="bPause" title="Pause (espace)">PAUSE</button>
      <button class="hb" id="bZen" title="Plein écran (H)">ZEN</button>
      <button class="hb on" id="bRight" title="Panneau de la machine (])">PANNEAU ◧</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="vignette"></div>
    <aside class="rail" id="rail" aria-label="Machines"></aside>
    <aside class="panel" id="panel" aria-label="Panneau de la machine"></aside>
    <button class="zenout" id="bZenOut" hidden>QUITTER LE ZEN</button>
    <div class="loading" id="loading">ÉVEIL DES MACHINES…</div>
  </main>
</div>
<script>
/* ═════ js/fk.js ═════ */
/* Fascination — petite boîte à outils partagée par toutes les expériences */
(function () {
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
  const rint = (n) => (Math.random() * n) | 0;
  const lerp = (a, b, t) => a + (b - a) * t;

  function buf(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    const img = g.createImageData(w, h);
    const d = img.data;
    for (let i = 3; i < d.length; i += 4) d[i] = 255;
    return { c, g, img, d, w, h, flush() { g.putImageData(img, 0, 0); } };
  }

  function layer(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
    return { c, g: c.getContext('2d'), w: c.width, h: c.height };
  }

  function blit(ctx, b, W, H) {
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(b.c, 0, 0, W, H);
  }

  // stops: [pos, r, g, b]
  function lut(stops) {
    const L = new Uint8Array(768);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let a = stops[0], b = stops[stops.length - 1];
      for (let s = 0; s < stops.length - 1; s++) {
        if (t >= stops[s][0] && t <= stops[s + 1][0]) { a = stops[s]; b = stops[s + 1]; break; }
      }
      const f = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
      L[i * 3] = lerp(a[1], b[1], f);
      L[i * 3 + 1] = lerp(a[2], b[2], f);
      L[i * 3 + 2] = lerp(a[3], b[3], f);
    }
    return L;
  }

  function diffuse(a, tmp, w, h, k) {
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) {
        const i = o + x;
        const l = a[x > 0 ? i - 1 : i], r = a[x < w - 1 ? i + 1 : i];
        tmp[i] = a[i] + (l + r - 2 * a[i]) * k;
      }
    }
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) {
        const i = o + x;
        const u = tmp[y > 0 ? i - w : i], d = tmp[y < h - 1 ? i + w : i];
        a[i] = tmp[i] + (u + d - 2 * tmp[i]) * k;
      }
    }
  }

  function fade(ctx, W, H, alpha, color) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color || '#06050c';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function hsv(h, s, v) {
    h = ((h % 1) + 1) % 1;
    const i = Math.floor(h * 6), f = h * 6 - i;
    const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    let r, g, b;
    switch (i % 6) {

    /* ───────── uniformes partagés ───────── */
    const uEA = new Float32Array(64), uEB = new Float32Array(64), uEG = new Float32Array(64), uEI = new Float32Array(64), uEC = new Float32Array(64), uEJ = new Float32Array(64), uEK = new Float32Array(64), uL = new Float32Array(64);
    function pack() {
      uEA.fill(0); uEB.fill(0); uEG.fill(0); uEI.fill(0); uEC.fill(0); uEJ.fill(0); uEK.fill(0); uL.fill(0);
      E.forEach((e, i) => {
        const g = geom(e), o = i * 4, S = ESS[e.sp];
        uEA[o] = g.ax; uEA[o + 1] = g.ay; uEA[o + 2] = g.bx; uEA[o + 3] = g.by;
        const salt = e.salt ? SELS[e.salt] : null, sk = salt ? (e.saltT > 1e8 ? 1 : Math.min(1, e.saltT / 4)) : 0;
        let fuel = 0, pilot = 0, pm = 0, smoke = 0, steam = 0, jet = 0, spark = 0, sv = 1, light = 0;
        const fl = (0.5 + 0.5 * n1(VT * 7 + e.seed * 40)) * (0.75 + 0.25 * n1(VT * 2.3 + e.seed * 9));

          steam = e.wet * (e.glow * 1.2 + e.flame) * 1.6;

          light = e.flame * 0.035 * fl;

        } else {

        uEG[o] = e.char; uEG[o + 1] = e.glow; uEG[o + 2] = e.wet; uEG[o + 3] = e.seed;
        uEI[o] = fuel; uEI[o + 1] = pilot; uEI[o + 2] = smoke; uEI[o + 3] = e.seed;
        if (salt) { uEC[o] = salt.col[0] * sk; uEC[o + 1] = salt.col[1] * sk; uEC[o + 2] = salt.col[2] * sk; }

        uEJ[o + 3] = jet;
        uEK[o] = spark; uEK[o + 1] = sv * kS;

      });
    }

    /* ───────── un pas de simulation (GPU) ───────── */
    function step(dt) {
      const { K, pg, GVW, GVH, GSW, GSH } = R;
      const vt = [1 / GVW, 1 / GVH], st = [1 / GSW, 1 / GSH];
      const g = cfg.g, vent = VENT(), ox = o2f();
      pg.curl.use().t('uVel', R.vel.r).f('uVt', vt[0], vt[1]);
      K.run(pg.curl, R.curl);
      const P = ptr && ptr.life > 0 ? ptr : null;
      pg.force.use().t('uVel', R.vel.r).t('uCurl', R.curl).t('uS', R.S.r)
        .f('uVt', vt[0], vt[1]).f('uRes', W, H).f('uCell', GVW / W, GVH / H)
        .f('uDt', dt).f('uBuoy', g * 1.2 * GVH).f('uWeight', g * 0.05 * GVH).f('uVort', 3 + 14 * cfg.turb).f('uTurb', cfg.turb * 0.14 * GVH).f('uTime', VT)
        .f('uDrag', Math.exp(-dt * 0.35)).f('uWind', cfg.wind * 0.6 * GVW, 0)
        .f('uPtr', P ? P.x : 0, P ? P.y : 0, P ? P.vx : 0, P ? P.vy : 0).f('uPtrR', P ? 70 * kS : 0)
        .i('uN', E.length).v4('uEA', uEA).v4('uEB', uEB).v4('uEJ', uEJ);
      K.run(pg.force, R.vel.w); R.vel.swap();
      if (P) { P.life -= 1; P.vx *= 0.6; P.vy *= 0.6; }
      pg.div.use().t('uVel', R.vel.r).f('uVt', vt[0], vt[1]);
      K.run(pg.div, R.div);
      for (let i = 0; i < R.Q.jac; i++) {
        pg.jacobi.use().t('uP', R.prs.r).t('uDiv', R.div).f('uVt', vt[0], vt[1]);
        K.run(pg.jacobi, R.prs.w); R.prs.swap();
      }
      pg.grad.use().t('uP', R.prs.r).t('uVel', R.vel.r).f('uVt', vt[0], vt[1]);
      K.run(pg.grad, R.vel.w); R.vel.swap();
      const kv = Math.exp(-dt * 0.1);
      pg.advect.use().t('uVel', R.vel.r).t('uSrc', R.vel.r).f('uVt', vt[0], vt[1]).f('uDt', dt).f('uKeep', kv, kv, 1, 1);
      K.run(pg.advect, R.vel.w); R.vel.swap();
      // combustible, chaleur, suie, vapeur, sels
      const sp = water ? { x: water.x, y: water.y, r: 46 * kS, m: 1 } : saltSplat ? { x: saltSplat.x, y: saltSplat.y, r: 30 * kS, m: 2 } : null;
      const sc = saltSplat ? SELS[saltSplat.k].col : [0, 0, 0];
      pg.inject.use().t('uS', R.S.r).t('uC', R.C.r).f('uRes', W, H).f('uDt', dt).f('uTime', VT)
        .i('uN', E.length).v4('uEA', uEA).v4('uEB', uEB).v4('uEI', uEI).v4('uEC', uEC)
        .f('uSplat', sp ? sp.x : 0, sp ? sp.y : 0, sp ? sp.r : 1, sp ? sp.m : 0).f('uSplatCol', sc[0], sc[1], sc[2]);
      K.run(pg.inject, R.S.w, R.C.w); R.S.swap(); R.C.swap();
      saltSplat = null;
      pg.react.use().t('uS', R.S.r).t('uC', R.C.r).f('uSt', st[0], st[1]).f('uDt', dt)
        .f('uO2', ox).f('uIgn', 0.3).f('uBurn', BURN).f('uHeat', 1.55).f('uSoot', 1.1 * (0.02 + 0.98 * clamp(g, 0, 1))).f('uRad', 0.5).f('uConv', 0.36 * (0.25 + 0.75 * clamp(g, 0, 1))).f('uVent', vent)
        .f('uDiff', 1.5 + 5 * (1 - clamp(g, 0, 1)), 2 + 22 * (1 - clamp(g, 0, 1)), 0.8, 1.2);
      K.run(pg.react, R.S.w, R.C.w); R.S.swap(); R.C.swap();
      const ks = Math.exp(-dt * (cfg.smoke ? 0.45 : 2.5));
      pg.advect2.use().t('uVel', R.vel.r).t('uS', R.S.r).t('uC', R.C.r).f('uVt', vt[0], vt[1]).f('uDt', dt)
        .f('uKeepS', Math.exp(-dt * 0.12), Math.exp(-dt * 0.5), ks, Math.exp(-dt * 0.7)).f('uKeepC', Math.exp(-dt * 0.45), Math.exp(-dt * 0.45), Math.exp(-dt * 0.45), 1).f('uTop', Math.exp(-dt * 3));

      // étincelles
      const NP = R.Q.side * R.Q.side;
      pg.part.use().t('uP', R.P.r).t('uQ', R.Pq.r).t('uVel', R.vel.r).f('uRes', W, H).f('uCell', GVW / W, GVH / H)
        .f('uDt', dt).f('uTime', VT % 1000).f('uG', clamp(g, 0, 2) * kS).f('uSpawnK', cfg.sparks ? (40 * Math.max(1, E.length)) / NP * kS : 0)
        .i('uN', E.length).v4('uEA', uEA).v4('uEB', uEB).v4('uEK', uEK)
        .f('uBurst', burst ? burst.x : 0, burst ? burst.y : 0, burst ? burst.p : 0, burst ? burst.s : 0);

    }

    /* ───────── rendu ───────── */
    function render() {
      const { K, gl, pg } = R;
      const ox = o2f(), vent = VENT();
      pg.emit.use().t('uS', R.S.r).t('uC', R.C.r).t('uBB', R.bb).f('uRes', W, H).f('uSt', 1 / R.GSW, 1 / R.GSH).f('uTime', VT)
        .f('uO2', ox).f('uIgn', 0.3).f('uBurn', BURN).f('uVent', vent).f('uFlame', 1).f('uSalt', 3.5).f('uBlue0', 0.06 + 0.5 * (1 - clamp(cfg.g, 0, 1))).f('uWob', 0.4 + 2 * cfg.turb).f('uDecor', env.decor === false ? 0 : 1)
        .i('uN', E.length).v4('uEA', uEA).v4('uEB', uEB).v4('uEG', uEG);

        gl.bindFramebuffer(gl.FRAMEBUFFER, R.E.fb); gl.viewport(0, 0, R.E.w, R.E.h);

        pg.blur.use().t('uT', tmp).f('uDir', 0, 1.5 / tmp.h); K.run(pg.blur, dst);
      };

      const bare = env.decor === false, ink = bare && env.theme === 'light';
      pg.comp.use().t('uBg', R.bg).t('uS', R.S.r).t('uE', R.E).t('uB1', R.b1).t('uB2', R.b2).t('uB3', R.b3)
        .f('uRes', W, H).f('uTime', VT).f('uAmb', d.amb).f('uAmbCol', d.ambCol[0], d.ambCol[1], d.ambCol[2]).f('uSky', d.sky)
        .f('uBloom', cfg.glow).f('uSmoke', cfg.smoke ? 0.65 : 0).f('uExpo', 1.35).f('uDecor', bare ? 0 : 1).f('uInk', ink ? 1 : 0).f('uPaper', ink ? 0.88 : 0, ink ? 0.84 : 0, ink ? 0.73 : 0)
        .i('uN', E.length).v4('uEA', uEA).v4('uEB', uEB).v4('uEG', uEG).v4('uL', uL);
      K.run(pg.comp, null);
      if (cfg.sparks) {
        // second tracé des étincelles, net, en pleine résolution (le premier nourrit le halo)
        gl.enable(gl.BLEND);

        pg.spark.use().t('uP', R.P.r).t('uQ', R.Pq.r).t('uBB', R.bb).f('uRes', W, H).i('uSide', R.Q.side).f('uStreak', 0.025).f('uGain', 1.1).f('uInk', ink ? 1 : 0);

      ctx.restore();
      drawLabel();
    }

    /* ───────── identification et mesure ───────── */
    function measure(x, y) {
      try {
        const u = x / W, v = 1 - y / H;
        const s = R.K.read(R.S.r, u * R.GSW, v * R.GSH), c = R.K.read(R.C.r, u * R.GSW, v * R.GSH);
        return { T: s[0], F: s[1], soot: s[2], steam: s[3], c, ok: true };
      } catch (e) { return { ok: false }; }
    }
    function zone(m) {
      const C = TK(m.T) - 273;
      const pm = m.F > 1e-3 ? m.c[3] / m.F : 0, saltI = m.c[0] + m.c[1] + m.c[2];
      if (m.steam > 0.35 && C < 300) return 'vapeur d’eau · panache blanc';
      if (saltI > 0.05 && C > 500) {
        let best = null, bd = 1e9;
        for (const k in SELS) {
          const s = SELS[k], t = s.col[0] + s.col[1] + s.col[2];
          const d = Math.hypot(s.col[0] / t - m.c[0] / saltI, s.col[1] / t - m.c[1] / saltI, s.col[2] / t - m.c[2] / saltI);
          if (d < bd) { bd = d; best = s; }
        }
        return 'raies du ' + best.nom + ' · ' + best.raie;
      }
      if (C > 600 && m.F > 0.02 && pm > 0.4) return 'cône bleu · radicaux CH* et C₂*';
      if (C > 800 && m.soot > 0.25) return 'zone éclairante · suie incandescente';
      if (C > 600 && m.F > 0.05) return 'base de la flamme · gaz en combustion';
      if (C > 525) return 'gaz chauds · au-delà du point de Draper';
      if (m.soot > 0.6) return 'fumée · suie refroidie';
      if (C > 90) return 'air chaud · invisible, il ondule';

    }
    function roleOf(e) {
      if (e.kind === 'log') {
        const st = !e.lit ? (e.glow > 0.08 ? 'éteinte, fume' : e.wet > 0.3 ? 'mouillée, attend' : 'pas encore prise') : e.mass < 0.25 ? 'lit de braises' : e.flame > 0.4 ? 'brûle' : 'couve';
        return ESS[e.sp].fr + ' · ' + st + ' · ' + Math.round((1 - e.mass) * 100) + ' % consumée' + (e.glow > 0.1 ? ' · braises ≈ ' + Math.round((525 + 380 * e.glow) / 10) * 10 + ' °C' : '') + (e.wet > 0.05 ? ' · humidité ' + Math.round(e.wet * 60) + ' %' : '') + (e.salt ? ' · ' + SELS[e.salt].nom : '');
      }
      if (e.kind === 'bougie') return 'bougie · ' + (e.lit ? (cfg.g < 0.15 ? 'flamme sphérique, sans convection' : 'flamme de diffusion ≈ 1 400 °C') : 'éteinte');
      return 'bec Bunsen · ' + (cfg.valve > 0.6 ? 'virole ouverte, flamme bleue' : cfg.valve > 0.25 ? 'virole entrouverte' : 'virole fermée, flamme jaune') + (e.salt ? ' · ' + SELS[e.salt].sym + ' : ' + SELS[e.salt].raie : '');
    }
    function drawLabel() {
      if (!label) return;
      const a = Math.min(1, label.t * 4, (6 - label.t) * 2);
      if (a <= 0.01) { label = null; return; }
      let x = label.x, y = label.y, name, role, col;
      if (label.e) {
        const e = label.e;
        if (!E.includes(e)) { label = null; return; }
        const g = geom(e);
        x = (g.ax + g.bx) / 2; y = e.kind === 'log' ? (g.ay + g.by) / 2 : g.ay + e.r * 2;
        name = ESS[e.sp].nom; role = roleOf(e); col = ESS[e.sp].col;
      } else {
        const m = label.m;
        if (!m || !m.ok) { name = 'Mesure indisponible'; role = 'ce navigateur ne lit pas les textures flottantes'; col = '#ffb070'; }
        else {
          const C = TK(m.T) - 273;
          name = (C < 40 ? '≈ ' + Math.round(C) : '≈ ' + (Math.round(C / 10) * 10).toLocaleString('fr-FR')) + ' °C';

      }
      const side = x > W * 0.62 ? -1 : 1, lx = x + side * 46, ly = y - 40;
      const paper = env.decor === false && env.theme === 'light';
      if (paper) col = label.e ? '#8a4a12' : col === '#ffb070' ? '#b4500e' : '#5d556b';

      ctx.globalAlpha = a;
      ctx.strokeStyle = col; ctx.lineWidth = 1;

      ctx.beginPath(); ctx.moveTo(x + side * 9, y - 8); ctx.lineTo(lx - side * 6, ly + 6); ctx.stroke();
      ctx.shadowColor = paper ? 'rgba(250,246,238,.9)' : 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6;
      ctx.textAlign = side > 0 ? 'left' : 'right';
      ctx.fillStyle = paper ? 'rgba(30,24,40,.94)' : 'rgba(250,248,240,.96)';
      ctx.font = (label.e ? 'italic ' : '') + '500 14px "Space Grotesk", sans-serif';
      ctx.fillText(name, lx, ly);
      ctx.fillStyle = col;
      ctx.font = '500 9.5px "JetBrains Mono", monospace';
      ctx.fillText(role.toUpperCase(), lx, ly + 15);
      ctx.restore();
    }

    /* ───────── boucle ───────── */
    let pending = false, rTimer = 0;
    function frame(t, dt) {
      if (lost) { tryRestore(); return; }
      if (dt > 0) {
        let left = Math.min(dt, 0.07);
        while (left > 1e-4) {
          const h = Math.min(left, 0.035);
          updateElems(h); pack(); step(h);
          left -= h;
        }
        if (water) {
          for (const e of E) if (hit(e, water.x, water.y + 20)) { e.wet = Math.min(1, e.wet + dt * 1.4); e.glow *= Math.exp(-dt * 1.2); }
        }
        if (label) {
          label.t += dt;
          if (!label.e && (rTimer += dt) > 0.3) { rTimer = 0; label.m = measure(label.x, label.y); }
        }
        // grondement : un bruit sourd qui suit la puissance du feu
        if (roar) {
          let pw = 0; for (const e of E) pw += e.flame * (e.kind === 'log' ? 1 : e.kind === 'bunsen' ? 0.5 : 0.08) + e.glow * 0.15;
          const c = au.ctx.currentTime;
          roar.gg.gain.setTargetAtTime(clamp(pw * 0.045, 0, 0.16), c, 0.25);
          roar.lp.frequency.setTargetAtTime(160 + pw * 70 + E.reduce((s, e) => s + e.boost, 0) * 300, c, 0.2);
        }

      if (!pending) { pending = true; queueMicrotask(() => { pending = false; if (!lost) render(); }); }
    }
    function tryRestore() {
      if (R.K.gl.isContextLost()) return;
      try { R = initGL(cfg.q); lost = false; paint(); } catch (e) { /* rien */ }
    }
    function setQuality(q) {
      if (q === cfg.q) return;
      try { const old = R; R = initGL(q); cfg.q = q; old.K.lose(); paint(); } catch (e) { console.warn(e); }
    }

    // crochet de diagnostic (tests automatisés) : inactif sauf si la page définit window.FASC_DEBUG
    if (window.FASC_DEBUG) window.FASC_DEBUG.feu = { get R() { return R; }, cfg, get E() { return E; }, setScene, measure: (x, y) => measure(x, y), run(n, h) { for (let i = 0; i < n; i++) { updateElems(h); pack(); step(h); } render(); }, stats() {
      const t = R.S.r, out = new Float32Array(t.w * t.h * 4);

      const mx = [0, 0, 0, 0], hot = { n: 0, ymin: 1 };
      for (let i = 0; i < out.length; i += 4) { for (let k = 0; k < 4; k++) mx[k] = Math.max(mx[k], out[i + k]); if (out[i] > 0.5) { hot.n++; hot.ymin = Math.min(hot.ymin, 1 - Math.floor(i / 4 / t.w) / t.h); } }
      return { max: mx.map((v) => +v.toFixed(3)), hotCells: hot.n, hotTop: +(hot.ymin).toFixed(3), grid: [t.w, t.h] };
    } };
    setScene('cheminee');
    // préchauffage : quelques secondes de simulation pour que le feu soit déjà pris
    for (let i = 0; i < 70; i++) { updateElems(1 / 30); pack(); step(1 / 30); }
    burst = null;

    function nearest(x, y) { for (let i = E.length - 1; i >= 0; i--) if (hit(E[i], x, y)) return E[i]; return null; }

    return {
      livePaused: true,
      frame,
      down(p) {
        const tool = env.tool;
        if (tool === 'observer') {
          const e = nearest(p.x, p.y);
          label = e ? { e, t: 0 } : { x: p.x, y: p.y, t: 0, m: measure(p.x, p.y) };
          rTimer = 0;
          if (snd()) au.note(1300, 0.08, 'sine', 0.03);
        } else if (tool === 'poser') {
          const e = nearest(p.x, p.y);
          if (e) { drag = { e, dx: e.x - p.x, dy: e.y - p.y }; return; }
          const v = view(), L = Math.min(v.w * 0.28, H * 0.45);
          let n = null;
          if (cfg.put === 'bougie') { const r = clamp(H * 0.03, 8, 26); n = addCandle(p.x, p.y + H * 0.13, H * 0.26, r); }
          else if (cfg.put === 'bunsen') { const r = clamp(H * 0.014, 5, 12); n = addBunsen(p.x, p.y + H * 0.15, H * 0.3, r); }
          else n = addLog(cfg.put, p.x, p.y, L * rnd(1.05, 0.85), rnd(0.2, -0.2), { glow: 0.5, char: 0.25 });
          if (n) { drag = { e: n, dx: 0, dy: 0 }; label = { e: n, t: 0 }; if (snd()) au.note(90, 0.25, 'sine', 0.12, 50); }
        } else if (tool === 'souffle') {
          ptr = { x: p.x, y: p.y, vx: 0, vy: 0, life: 0 };

      for (let i = 0; i < 5; i++) kois.push({ x: v.x0 + rnd(v.w), y: rnd(H), a: rnd(TAU), sp: rnd(40, 20) * kS, len: rnd(110, 70) * kS, depth: rnd(0.8, 0.4), ph: rnd(TAU), var: i % KOI.length, seed: rnd(10), wand: rnd(100), target: null, startle: 0, gulp: 0 });
      for (let i = 0; i < 6; i++) gerris.push(mkGerris(v.x0 + rnd(v.w * 0.8, v.w * 0.2), rnd(H * 0.8, H * 0.2)));
      const gx = v.x0 + v.w * rnd(0.7, 0.3), gy = H * rnd(0.7, 0.3);
      for (let i = 0; i < 12; i++) gyrins.push({ x: gx + rnd(30, -30) * kS, y: gy + rnd(30, -30) * kS, a: rnd(TAU), w: rnd(4, -4), sp: rnd(50, 25) * kS, alarm: 0 });
    }
    function mkGerris(x, y) { return { x, y, a: rnd(TAU), vx: 0, vy: 0, t: rnd(1.2), st: 'erre', prey: null, fed: 0, sig: 0, sex: Math.random() < 0.5 ? 'm' : 'f', jump: 0 }; }

    /* ───────── scènes et expériences ───────── */
    function setScene(id) {
      cfg.scene = id;
      plates.length = 0; walls = []; osc = []; line = null; mover = null; srcs = [];
      R.K.clear(R.Wv.r); R.K.clear(R.Wv.w);
      label = null;
      if (id === 'cuve') {
        gerris = []; gyrins = []; kois = []; pads = []; flies = []; pellets = [];
        weather.rain = weather.target = 0;
        Object.assign(cfg, { damp: 0.15, sun: 1, glint: false, auto: false });
        setExp(cfg.exp);
      } else {
        Object.assign(cfg, { damp: 0.35, sun: 0.85, glint: true, auto: true, mean: false, breeze: id === 'averse' ? 0.15 : 0.4 });
        populate();
        if (id === 'averse') { weather.rain = 0.2; weather.target = 0.8; weather.next = 30; }
        else { weather.rain = 0; weather.target = 0; weather.next = 20; }
      }
      paintD(); paintFloor();
    }
    function setExp(k) {
      cfg.exp = k;
      plates.length = 0; walls = []; osc = []; line = null; mover = null;
      const v = view(), cx = v.cx, cy = H / 2, lam = 80 * kS;
      const gap = (0.3 + cfg.gap * 1.4) * lam;
      if (k === 'deux') { const d = (0.6 + cfg.gap * 2.6) * lam / 2; osc.push({ x: cx - d, y: cy * 0.55 }, { x: cx + d, y: cy * 0.55 }); }
      else if (k === 'fente' || k === 'double') {
        line = { x: v.x0 + 64 * kS };
        const wx = v.x0 + v.w * 0.42, th = 8 * kS;
        if (k === 'fente') { walls.push({ ax: wx, ay: -20, bx: wx, by: cy - gap / 2, wd: th }, { ax: wx, ay: cy + gap / 2, bx: wx, by: H + 20, wd: th }); }
        else {
          const s = gap * 0.45, sep = (0.8 + cfg.gap) * lam;
          walls.push({ ax: wx, ay: -20, bx: wx, by: cy - sep / 2 - s / 2, wd: th }, { ax: wx, ay: cy - sep / 2 + s / 2, bx: wx, by: cy + sep / 2 - s / 2, wd: th }, { ax: wx, ay: cy + sep / 2 + s / 2, bx: wx, by: H + 20, wd: th });
        }
      } else if (k === 'refraction') {
        line = { x: v.x0 + 64 * kS };
        plates.push({ kind: 'rect', x: v.x0 + v.w * 0.62, y: cy, w: v.w * 0.5, h: H * 1.6, a: 0.5, c: 0.35 });
      } else if (k === 'lentille') {
        line = { x: v.x0 + 64 * kS };
        plates.push({ kind: 'lens', x: v.x0 + v.w * 0.4, y: cy, rx: v.w * 0.07, ry: H * 0.36, c: 0.4 });
      } else if (k === 'doppler') {
        mover = { x: v.x0 + v.w * 0.15, y: cy, dir: 1 };
      }
      paintD();
    }

    /* ───────── sons ───────── */
    let amb = null, lastPlink = 0, plinkN = 0;
    if (snd()) {
      const c = au.ensure();
      if (c) {
        const s = c.createBufferSource(); s.buffer = au.noiseBuf(); s.loop = true;
        const hp = c.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 600; hp.Q.value = 0.4;
        const gg = c.createGain(); gg.gain.value = 0.0001;
        s.connect(hp); hp.connect(gg); gg.connect(au.master); s.start();
        amb = { s, hp, gg };
      }
    }
    function plink(r) {
      if (!snd()) return;
      if (VT - lastPlink < 0.03) { if (++plinkN > 3) return; } else plinkN = 0;
      lastPlink = VT;
      // fréquence de Minnaert : f ≈ 3,26 / R (R en mètres) ; la bulle remonte et la note glisse vers l'aigu
      const f = clamp(3.26 / (r * 0.001), 700, 4200);
      au.note(f, 0.09 + Math.random() * 0.05, 'sine', 0.05 + Math.random() * 0.05, f * 1.4);
    }
    function gulpSound() { if (snd()) { au.note(150, 0.18, 'sine', 0.13, 70); au.noise(0.12, 0.05, 500, 1, 'lowpass'); } }

    /* ───────── évènements ───────── */
    function drop(x, y, big) {
      const r = (big ? rnd(9, 6) : rnd(5, 3)) * kS;
      addSrc(x, y, big ? -1.4 : -0.55, r);
      splashes.push({ x, y, t: 0, r: r * 1.6 });
      plink(big ? rnd(3.2, 2.2) : rnd(2.2, 1.2));
      alarm(x, y, big ? 120 * kS : 60 * kS);
    }
    function alarm(x, y, rad) {
      for (const g of gyrins) if (Math.hypot(g.x - x, g.y - y) < rad * 2) g.alarm = Math.max(g.alarm, 2.2);
      for (const k of kois) if (Math.hypot(k.x - x, k.y - y) < rad * 1.3 && k.startle <= 0) {
        k.startle = 0.6; k.a = Math.atan2(k.y - y, k.x - x) + rnd(0.4, -0.4); k.depth = Math.min(0.95, k.depth + 0.3);
      }
      for (const g of gerris) if (Math.hypot(g.x - x, g.y - y) < rad * 0.6) { g.a = Math.atan2(g.y - y, g.x - x); g.jump = 0.3; }
    }
    function addFly(x, y) { if (flies.length < 6) { flies.push({ x, y, t: 0, buzz: 0, alive: true, a: rnd(TAU), by: null }); addSrc(x, y, -0.5, 4 * kS); } }

    /* ───────── comportements (CPU) ───────── */
    function update(dt) {
      VT += dt;
      const v = view();
      // météo : averses et risées spontanées
      if (cfg.auto && cfg.scene !== 'cuve') {
        weather.next -= dt;
        if (weather.next <= 0) {
          if (weather.target > 0) { weather.target = 0; weather.next = rnd(70, 35); }
          else if (Math.random() < 0.5) { weather.target = rnd(0.8, 0.3); weather.next = rnd(28, 14); }
          else { gust = { x: v.x0 - 80, y: rnd(H), vx: rnd(120, 60) * kS, life: rnd(9, 5), r: rnd(170, 100) * kS }; weather.next = rnd(30, 15); }
        }
        if (Math.random() < dt / 18 && flies.length < 3) addFly(v.x0 + rnd(v.w * 0.85, v.w * 0.15), rnd(H * 0.85, H * 0.15));
      }
      weather.rain += (weather.target - weather.rain) * (1 - Math.exp(-dt * 0.4));
      // brise : de petites rides partout, qui dessinent au fond le filet de lumière
      if (cfg.scene !== 'cuve') {
        const nb = Math.min(8, Math.round(cfg.breeze * 9 * (0.6 + 0.4 * n1(VT * 0.2))));
        for (let k = 0; k < nb; k++) addSrc(rnd(W), rnd(H), rnd(0.75, -0.75) * cfg.breeze, rnd(22, 12) * kS);
      }
      let nd = weather.rain * 70 * dt * (v.w * H / 1e6 + 0.3);
      while (nd > 0) { if (Math.random() < nd) drop(v.x0 + rnd(v.w), rnd(H), false); nd -= 1; }
      if (gust) {
        gust.x += gust.vx * dt; gust.life -= dt;
        for (let k = 0; k < 3; k++) { const a = rnd(TAU), d = Math.sqrt(Math.random()) * gust.r; addSrc(gust.x + Math.cos(a) * d * 1.6, gust.y + Math.sin(a) * d * 0.7, rnd(0.06, -0.06), 3 * kS); }
        for (const p of pads) if (Math.hypot(p.x - gust.x, p.y - gust.y) < gust.r * 1.4) p.x += dt * 6 * kS;
        for (const g of gerris) if (Math.hypot(g.x - gust.x, g.y - gust.y) < gust.r * 1.4) g.vx += dt * 30 * kS;
        if (gust.life <= 0 || gust.x > v.x1 + 200) gust = null;
      }
      // nénuphars : ils tournent doucement et dérivent
      for (const p of pads) { p.a += p.va * dt; }
      // mouches : elles se débattent (rides périodiques), s'épuisent, s'envolent parfois
      for (let i = flies.length - 1; i >= 0; i--) {
        const f = flies[i];
        f.t += dt;
        const vigor = Math.exp(-f.t / 30);
        if (!f.by && Math.random() < dt * 7 * vigor) { addSrc(f.x + rnd(3, -3), f.y + rnd(3, -3), rnd(0.22, 0.1) * vigor, 3 * kS); f.buzz = 0.15; }
        f.buzz -= dt;
        if (!f.by && f.t > 9 && Math.random() < dt * 0.02) { flies.splice(i, 1); continue; }
        if (f.gone) flies.splice(i, 1);
      }
      for (let i = pellets.length - 1; i >= 0; i--) { const p = pellets[i]; p.t += dt; p.x += Math.sin(VT + p.s) * 2 * dt; if (p.t > 60 || p.gone) pellets.splice(i, 1); }
      // gerris
      for (const g of gerris) {
        g.t -= dt; g.jump = Math.max(0, g.jump - dt);
        g.sig = Math.max(0, g.sig - dt);
        if (g.prey && (g.prey.gone || !flies.includes(g.prey))) { g.prey = null; g.st = 'erre'; }
        if (!g.prey && g.st !== 'mange') {
          let best = null, bd = 320 * kS;
          for (const f of flies) { if (f.by) continue; const d = Math.hypot(f.x - g.x, f.y - g.y); if (d < bd) { bd = d; best = f; } }
          if (best) { g.prey = best; g.st = 'chasse'; }
        }
        if (g.st === 'mange') {
          g.eat -= dt;
          if (g.eat <= 0) { if (g.prey) { g.prey.gone = true; } g.prey = null; g.st = 'erre'; g.fed++; }
        } else {
          let ta = g.a;
          if (g.prey) {
            ta = Math.atan2(g.prey.y - g.y, g.prey.x - g.x);
            if (Math.hypot(g.prey.x - g.x, g.prey.y - g.y) < 9 * kS && !g.prey.by) { g.prey.by = g; g.st = 'mange'; g.eat = rnd(9, 5); g.vx = g.vy = 0; }
          } else ta = g.a + (n1(VT * 0.3 + g.x * 0.01) - 0.5) * 0.8;
          // évite les bords, les nénuphars et les congénères
          if (!inView(g.x, g.y, 50)) ta = Math.atan2(H / 2 - g.y, v.cx - g.x);
          for (const o of gerris) if (o !== g) { const d = Math.hypot(o.x - g.x, o.y - g.y); if (d < 40 * kS) { ta = Math.atan2(g.y - o.y, g.x - o.x); if (g.sex === 'm' && o.sex === 'm' && g.sig <= 0) g.sig = 0.8; } }
          for (const p of pads) if (Math.hypot(p.x - g.x, p.y - g.y) < p.r + 14 * kS) ta = Math.atan2(g.y - p.y, g.x - p.x);
          g.a += angd(g.a, ta) * Math.min(1, dt * (g.prey ? 6 : 2.5));
          if (g.t <= 0 || g.jump > 0) {
            // un coup de rame : la paire du milieu pousse, deux petites rides naissent
            const s = (g.jump > 0 ? 260 : g.prey ? 150 : rnd(110, 50)) * kS;
            g.vx += Math.cos(g.a) * s; g.vy += Math.sin(g.a) * s;
            const px = -Math.sin(g.a), py = Math.cos(g.a);
            addSrc(g.x + px * 9 * kS, g.y + py * 9 * kS, 0.12, 3 * kS); addSrc(g.x - px * 9 * kS, g.y - py * 9 * kS, 0.12, 3 * kS);
            g.t = g.prey ? rnd(0.45, 0.25) : rnd(2.2, 0.7);
            g.jump = 0;
          }
        }
        // signaux des mâles : battements rapides des pattes, qui font des ondes concentriques
        if (g.sig > 0 && Math.random() < dt * 25) addSrc(g.x, g.y, 0.06, 4 * kS);
        const fr = Math.exp(-dt * 2.8);
        g.vx *= fr; g.vy *= fr;
        g.x += g.vx * dt; g.y += g.vy * dt;
        g.x = clamp(g.x, v.x0 + 10, v.x1 - 10); g.y = clamp(g.y, 10, H - 10);
      }
      // gyrins : radeau serré qui tourne, dispersion en zigzag quand on les dérange
      let cx = 0, cy = 0;
      for (const g of gyrins) { cx += g.x; cy += g.y; }
      cx /= gyrins.length || 1; cy /= gyrins.length || 1;
      for (const g of gyrins) {
        g.alarm = Math.max(0, g.alarm - dt);
        const al = g.alarm > 0;
        g.w += (rnd(1, -1) * (al ? 20 : 5)) * dt; g.w = clamp(g.w, -7, 7);
        let ta = g.a + g.w * dt;
        if (!al) { const d = Math.hypot(cx - g.x, cy - g.y); if (d > 26 * kS) ta = g.a + angd(g.a, Math.atan2(cy - g.y, cx - g.x)) * 0.25; }
        for (const o of gyrins) if (o !== g && Math.hypot(o.x - g.x, o.y - g.y) < 7 * kS) ta = Math.atan2(g.y - o.y, g.x - o.x);
        if (!inView(g.x, g.y, 40)) ta = Math.atan2(H / 2 - g.y, v.cx - g.x);
        for (const p of pads) if (Math.hypot(p.x - g.x, p.y - g.y) < p.r + 8 * kS) ta = Math.atan2(g.y - p.y, g.x - p.x);
        g.a += angd(g.a, ta) * Math.min(1, dt * 8);
        const sp = g.sp * (al ? 3.2 : 1) * (0.7 + 0.3 * Math.sin(VT * 3 + g.w));
        g.x += Math.cos(g.a) * sp * dt; g.y += Math.sin(g.a) * sp * dt;
        if (Math.random() < dt * (al ? 30 : 10)) addSrc(g.x + Math.cos(g.a) * 4 * kS, g.y + Math.sin(g.a) * 4 * kS, 0.05 * (al ? 2 : 1), 3 * kS);
      }
      // koïs
      for (const k of kois) {
        k.startle = Math.max(0, k.startle - dt);
        k.gulp = Math.max(0, k.gulp - dt);
        if (k.target && (k.target.gone || (!flies.includes(k.target) && !pellets.includes(k.target)))) k.target = null;
        if (!k.target && k.startle <= 0) {
          let best = null, bd = 380 * kS;
          for (const f of pellets) { if (f.claimed && f.claimed !== k) continue; const d = Math.hypot(f.x - k.x, f.y - k.y); if (d < bd) { bd = d; best = f; } }
          if (!best) for (const f of flies) { if (f.by || f.t < 3) continue; const d = Math.hypot(f.x - k.x, f.y - k.y); if (d < bd * 0.8) { bd = d; best = f; } }
          if (best) { k.target = best; best.claimed = k; }
        }
        let ta, spd = k.sp, dep = 0.35 + 0.35 * n1(VT * 0.07 + k.seed);
        const head = { x: k.x + Math.cos(k.a) * k.len * 0.05, y: k.y + Math.sin(k.a) * k.len * 0.05 };
        if (k.startle > 0) { ta = k.a; spd = k.sp * 6; dep = 0.95; }
        else if (k.target) {
          ta = Math.atan2(k.target.y - head.y, k.target.x - head.x);
          const d = Math.hypot(k.target.x - head.x, k.target.y - head.y);
          spd = k.sp * 1.6; dep = clamp(d / (200 * kS), 0.05, 0.6);
          if (d < 14 * kS) {
            // le gobage : un anneau d'ondes, un bruit sourd
            k.target.gone = true; k.target.by = k; k.target = null; k.gulp = 0.5;
            addSrc(head.x, head.y, -1.1, 9 * kS); gulpSound();
            for (const g of gerris) if (Math.hypot(g.x - head.x, g.y - head.y) < 50 * kS) { g.jump = 0.3; g.a = Math.atan2(g.y - head.y, g.x - head.x); }
          }
        } else {
          k.wand += dt * 0.25;
          ta = k.a + (n1(k.wand + k.seed * 7) - 0.5) * 2.2 * dt * 4;
          for (const o of kois) if (o !== k) { const d = Math.hypot(o.x - k.x, o.y - k.y); if (d < k.len * 0.9) ta = k.a + angd(k.a, Math.atan2(k.y - o.y, k.x - o.x)) * 0.3; }
        }
        if (!inView(k.x, k.y, k.len * 0.6)) ta = k.a + angd(k.a, Math.atan2(H / 2 - k.y, v.cx - k.x)) * 0.5;
        k.a += clamp(angd(k.a, ta), -2.5 * dt * (k.startle > 0 ? 6 : 1), 2.5 * dt * (k.startle > 0 ? 6 : 1));
        k.depth += (dep - k.depth) * (1 - Math.exp(-dt * 1.2));
        k.x += Math.cos(k.a) * spd * dt; k.y += Math.sin(k.a) * spd * dt;
        k.ph += dt * (3 + spd / (12 * kS));
        if (k.depth < 0.18 && Math.random() < dt * 12) addSrc(head.x, head.y, 0.07, 6 * kS);
      }
      for (let i = splashes.length - 1; i >= 0; i--) { splashes[i].t += dt; if (splashes[i].t > 0.35) splashes.splice(i, 1); }
      if (amb) {
        const c = au.ctx.currentTime;
        amb.gg.gain.setTargetAtTime(0.006 + weather.rain * 0.05 + (gust ? 0.025 : 0), c, 0.5);
        amb.hp.frequency.setTargetAtTime(500 + weather.rain * 3500, c, 0.5);
      }
    }

    /* ───────── uniformes ───────── */
    const uSrc = new Float32Array(256), uPad = new Float32Array(64), uF0 = new Float32Array(32), uF1 = new Float32Array(32), uC = new Float32Array(192);
    let nC = 0;
    function packScene() {
      uPad.fill(0); uF0.fill(0); uF1.fill(0); uC.fill(0); nC = 0;
      pads.forEach((p, i) => { if (i < 16) { uPad[i * 4] = p.x; uPad[i * 4 + 1] = p.y; uPad[i * 4 + 2] = p.r; } });
      kois.forEach((k, i) => { if (i < 8) { uF0.set([k.x, k.y, k.a, k.len], i * 4); uF1.set([k.ph, clamp(k.depth, 0, 1), k.var, k.seed], i * 4); } });
      const cast = (x, y, r, kind) => { if (nC < 48) { uC.set([x, y, r, kind], nC * 4); nC++; } };
      for (const p of pads) cast(p.x, p.y, p.r, 0);
      for (const g of gerris) {
        const c = Math.cos(g.a), s = Math.sin(g.a);
        const feet = [[2, 15], [2, -15], [-14, 12], [-14, -12]];
        for (const [fx, fy] of feet) cast(g.x + (c * fx - s * fy) * kS, g.y + (s * fx + c * fy) * kS, 3.2 * kS, 1);
      }
      for (const f of flies) if (!f.gone) cast(f.x, f.y, 5 * kS, 2);
    }

    /* ───────── un sous-pas de l'onde (GPU) ───────── */
    let stepN = 0;
    function waveStep(extra) {
      const { K, pg, GW, GH } = R;
      uSrc.fill(0);
      const n = Math.min(64, srcs.length / 4 + extra.length / 4);
      uSrc.set(srcs.slice(0, 256));
      if (extra.length) uSrc.set(extra.slice(0, 256 - Math.min(256, srcs.length)), Math.min(256, srcs.length));
      const K2 = 1.75 * (0.25 + 0.75 * cfg.depth);
      const damp = 1 - 0.0004 - cfg.damp * 0.006;
      const L = line ? [line.x, Math.sin(stepN * waveW()) * 0.3, 1.5 * cell(), 1] : [0, 0, 0, 0];
      pg.wave.use().t('uW', R.Wv.r).t('uD', R.D).f('uWt', 1 / GW, 1 / GH).f('uRes', W, H).f('uK', K2).f('uDamp', damp).f('uSponge', 1).f('uCellPx', cell()).f('uVisc', 0.015 + cfg.damp * 0.08)
        .f('uLine', L[0], L[1], L[2], L[3]).i('uNP', Math.min(16, pads.length)).v4('uPad', uPad).i('uNS', n).v4('uSrc', uSrc);
      K.run(pg.wave, R.Wv.w); R.Wv.swap();
      stepN++;
    }
    // pulsation des sources de la cuve, en radians par sous-pas
    const waveW = () => 0.12 + cfg.freq * 0.32;

    /* ───────── rendu ───────── */
    function render() {
      const { K, gl, pg } = R;
      const bare = env.decor === false, ink = bare && env.theme === 'light';
      const tank = cfg.scene === 'cuve';
      const sunDir = [0.35, 0.55], slope = 30, depthPx = (tank ? 46 : 60) * kS * (0.5 + cfg.depth * 0.7);
      // caustiques : chaque sommet du maillage suit un rayon réfracté jusqu'au fond
      gl.bindFramebuffer(gl.FRAMEBUFFER, R.cau.fb); gl.viewport(0, 0, R.cau.w, R.cau.h);
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      pg.caust.use().t('uW', R.Wv.r).t('uD', R.D).f('uRes', W, H).f('uWt', 1 / R.GW, 1 / R.GH).f('uSunDir', sunDir[0], sunDir[1]).f('uSlope', slope).f('uDepth', depthPx).f('uCell', cell()).f('uGain', 1);
      gl.bindVertexArray(R.mesh.vao);
      gl.drawElements(gl.TRIANGLES, R.mesh.n, gl.UNSIGNED_SHORT, 0);
      gl.disable(gl.BLEND);
      packScene();
      pg.comp.use().t('uW', R.Wv.r).t('uD', R.D).t('uCau', R.cau).t('uFloor', R.floor)
        .f('uRes', W, H).f('uWt', 1 / R.GW, 1 / R.GH).f('uSunDir', sunDir[0] * 30 / 60, sunDir[1] * 30 / 60).f('uTime', VT)
        .f('uSlope', slope).f('uRefr', 9 * kS).f('uSun', cfg.sun).f('uDecor', bare ? 0 : 1).f('uInk', ink ? 1 : 0).f('uTank', tank ? 1 : 0)
        .f('uGlint', cfg.glint ? 1 : 0).f('uMean', cfg.mean ? 1 : 0).f('uDepth', depthPx).f('uCell', cell())
        .f('uWater', 0.018, 0.085, 0.075).f('uCauT', 1 / R.cau.w, 1 / R.cau.h).f('uPaper', 0.88, 0.84, 0.73).f('uSky', 0.55, 0.68, 0.8)
        .i('uNF', bare ? 0 : Math.min(8, kois.length)).v4('uF0', uF0).v4('uF1', uF1).i('uNC', bare ? 0 : nC).v4('uC', uC);
      K.run(pg.comp, null);
      ctx.save();
      ctx.globalCompositeOperation = 'copy';
      ctx.drawImage(K.canvas, 0, 0, W, H);
      ctx.restore();
      if (!bare) drawSurface();
      drawLabel(bare && env.theme === 'light');
    }

    /* ───────── ce qui flotte (2D, au-dessus de l'eau) ───────── */
    function drawSurface() {
      ctx.save();
      // traits des murs dans la cuve : rien à dessiner, le GPU s'en charge
      for (const p of pads) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        const g = ctx.createRadialGradient(-p.r * 0.2, -p.r * 0.2, p.r * 0.1, 0, 0, p.r);
        g.addColorStop(0, `hsl(${100 + p.hue * 20},45%,42%)`); g.addColorStop(1, `hsl(${95 + p.hue * 15},50%,28%)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, p.r, 0.12, TAU - 0.12); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(200,230,150,.25)'; ctx.lineWidth = 1;
        for (let k = 1; k < 14; k++) { const a = 0.12 + (k / 14) * (TAU - 0.24); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * p.r * 0.92, Math.sin(a) * p.r * 0.92); ctx.stroke(); }
        ctx.strokeStyle = 'rgba(120,40,40,.45)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, p.r - 1, 0.12, TAU - 0.12); ctx.stroke();
        if (p.flower) {
          ctx.rotate(-p.a * 1.3);
          for (let k = 0; k < 16; k++) {
            const a = (k / 16) * TAU + (k % 2) * 0.2, l = p.r * (k % 2 ? 0.42 : 0.5);
            ctx.fillStyle = k % 2 ? 'rgba(250,240,245,.95)' : 'rgba(255,255,255,.98)';
            ctx.beginPath(); ctx.ellipse(Math.cos(a) * l * 0.5, Math.sin(a) * l * 0.5, l * 0.5, l * 0.17, a, 0, TAU); ctx.fill();
          }
          ctx.fillStyle = '#f2c84b'; ctx.beginPath(); ctx.arc(0, 0, p.r * 0.11, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }
      for (const p of pellets) { ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.6 * kS, 0, TAU); ctx.fill(); }
      for (const f of flies) {
        if (f.gone) continue;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
        const wob = f.buzz > 0 ? Math.sin(VT * 90) * 0.5 : 0.1;
        ctx.fillStyle = 'rgba(220,230,240,.45)';
        for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(-1 * kS, s * 4 * kS, 5 * kS, 2.2 * kS, s * (0.5 + wob), 0, TAU); ctx.fill(); }
        ctx.fillStyle = '#22201c'; ctx.beginPath(); ctx.ellipse(0, 0, 4.5 * kS, 2.4 * kS, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#7a2a1a'; ctx.beginPath(); ctx.arc(3.6 * kS, 0, 1.8 * kS, 0, TAU); ctx.fill();
        ctx.restore();
      }
      for (const g of gyrins) {
        ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.a);
        ctx.fillStyle = '#0d0f14'; ctx.beginPath(); ctx.ellipse(0, 0, 3.6 * kS, 2.3 * kS, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(170,200,255,.75)'; ctx.beginPath(); ctx.ellipse(0.8 * kS, -0.8 * kS, 1.6 * kS, 0.7 * kS, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      ctx.lineCap = 'round';
      for (const g of gerris) {
        ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.a); ctx.scale(kS, kS);
        ctx.strokeStyle = 'rgba(40,30,20,.9)'; ctx.lineWidth = 0.9;
        const row = Math.sin(g.t * 8) * 1.5;
        ctx.beginPath();
        ctx.moveTo(4, 1); ctx.lineTo(8, 4); ctx.moveTo(4, -1); ctx.lineTo(8, -4);
        ctx.moveTo(1, 1.2); ctx.quadraticCurveTo(3, 10, 2 + row, 15); ctx.moveTo(1, -1.2); ctx.quadraticCurveTo(3, -10, 2 + row, -15);
        ctx.moveTo(-2, 1); ctx.quadraticCurveTo(-8, 8, -14, 12); ctx.moveTo(-2, -1); ctx.quadraticCurveTo(-8, -8, -14, -12);
        ctx.stroke();
        ctx.fillStyle = '#3a2c1c'; ctx.beginPath(); ctx.ellipse(-1, 0, 7, 1.7, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#5a4428'; ctx.beginPath(); ctx.ellipse(5, 0, 1.8, 1.3, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(235,245,255,.7)';
      for (const s of splashes) { const k = s.t / 0.35; ctx.globalAlpha = 1 - k; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + k * 1.4), 0, TAU); ctx.stroke(); }
      ctx.restore();
    }

    /* ───────── identification ───────── */
    function pick(x, y) {
      for (const g of gerris) if (Math.hypot(g.x - x, g.y - y) < 18 * kS) return { kind: 'gerris', o: g };
      for (const g of gyrins) if (Math.hypot(g.x - x, g.y - y) < 10 * kS) return { kind: 'gyrin', o: g };
      for (const f of flies) if (Math.hypot(f.x - x, f.y - y) < 12 * kS) return { kind: 'mouche', o: f };
      for (const p of pads) if (Math.hypot(p.x - x, p.y - y) < p.r) return { kind: 'pad', o: p };
      for (const k of kois) { const dx = x - k.x, dy = y - k.y, u = -(dx * Math.cos(k.a) + dy * Math.sin(k.a)) / k.len, vv = Math.abs(-dx * Math.sin(k.a) + dy * Math.cos(k.a)); if (u > -0.1 && u < 1 && vv < k.len * 0.16) return { kind: 'koi', o: k }; }
      return null;
    }
    function measure(x, y) {
      try {
        const t = R.Wv.r, gl = R.gl, out = new Float32Array(t.w * t.h * 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.readPixels(0, 0, t.w, t.h, gl.RGBA, gl.FLOAT, out);
        const i = clamp(Math.floor(x / W * t.w), 0, t.w - 1), j = clamp(Math.floor((1 - y / H) * t.h), 0, t.h - 1), o = (j * t.w + i) * 4;
        let mx = 0; for (let k = 2; k < out.length; k += 4) mx = Math.max(mx, out[k]);
        return { h: out[o], mean: out[o + 2], max: mx, ok: true };
      } catch (e) { return { ok: false }; }
    }
    function describe(l) {
      if (l.kind === 'gerris') { const g = l.o; return ['Gerris lacustris', 'gerris ' + (g.sex === 'm' ? 'mâle' : 'femelle') + ' · ' + (g.st === 'mange' ? 'dévore sa proie' : g.st === 'chasse' ? 'a senti une proie aux rides, fonce' : g.sig > 0 ? 'signale aux rivaux par vibrations' : 'patrouille') + (g.fed ? ' · ' + g.fed + ' proie' + (g.fed > 1 ? 's' : '') : ''), '#c9a36a']; }
      if (l.kind === 'gyrin') return ['Gyrinus substriatus', 'gyrin · ' + (l.o.alarm > 0 ? 'alerté, se disperse en zigzag' : 'tourne avec le radeau'), '#9fb7ff'];
      if (l.kind === 'mouche') return ['Musca domestica', 'mouche · ' + (l.o.by ? 'capturée' : l.o.t < 8 ? 'se débat, fait vibrer l’eau' : 'épuisée'), '#b0a490'];
      if (l.kind === 'pad') return ['Nymphaea alba', 'nénuphar blanc · ' + (l.o.flower ? 'en fleur · ' : '') + 'feuille de ' + Math.round(l.o.r / kS * 0.5) + ' cm', '#6fcf6a'];
      if (l.kind === 'koi') { const k = l.o; return ['Cyprinus rubrofuscus', 'koï ' + KOI[k.var].nom + ' · ' + KOI[k.var].desc + ' · ' + (k.startle > 0 ? 'départ en C, fuit' : k.target ? 'monte gober' : 'à ' + Math.round(k.depth * 60) + ' cm de fond'), '#ff7a3c']; }
      const m = l.m;
      if (!m || !m.ok) return ['Mesure indisponible', 'ce navigateur ne lit pas les textures flottantes', '#9fd0ff'];
      const mm = m.h * 2.5;
      const name = Math.abs(mm) < 0.05 ? 'Eau calme' : (mm > 0 ? 'Crête +' : 'Creux −') + Math.abs(mm).toFixed(1).replace('.', ',') + ' mm';
      let role = 'surface';
      if (cfg.scene === 'cuve' && (osc.length || line)) {
        const r = m.max > 0 ? Math.sqrt(m.mean / m.max) : 0;
        role = r > 0.55 ? 'ventre · interférence constructive' : r < 0.2 ? 'nœud · les ondes s’annulent' : 'entre nœud et ventre';
        role += ' · amplitude moyenne ' + Math.round(r * 100) + ' %';
      } else role = Math.abs(mm) < 0.05 ? 'la lumière traverse sans dévier' : mm > 0 ? 'crête : concentre la lumière, comme une loupe' : 'creux : étale la lumière';
      return [name, role, '#9fd0ff'];
    }
    function drawLabel(paper) {
      if (!label) return;
      const a = Math.min(1, label.t * 4, (6 - label.t) * 2);
      if (a <= 0.01) { label = null; return; }
      const o = label.o;
      if (o && (o.gone || (label.kind === 'mouche' && !flies.includes(o)))) { label = null; return; }
      const x = o ? o.x : label.x, y = o ? o.y : label.y;
      let [name, role, col] = describe(label);
      if (paper) col = '#245a6e';
      const side = x > W * 0.62 ? -1 : 1, lx = x + side * 46, ly = y - 40;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + side * 10, y - 9); ctx.lineTo(lx - side * 6, ly + 6); ctx.stroke();
      ctx.shadowColor = paper ? 'rgba(250,246,238,.9)' : 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6;
      ctx.textAlign = side > 0 ? 'left' : 'right';
      ctx.fillStyle = paper ? 'rgba(30,24,40,.94)' : 'rgba(250,250,245,.96)';
      ctx.font = (label.kind === 'eau' ? '' : 'italic ') + '500 14px "Space Grotesk", sans-serif';
      ctx.fillText(name, lx, ly);
      ctx.fillStyle = col;
      ctx.font = '500 9.5px "JetBrains Mono", monospace';
      ctx.fillText(role.toUpperCase(), lx, ly + 15);
      ctx.restore();
    }

    /* ───────── boucle ───────── */
    let pending = false, finger = null, rainAt = null, rTimer = 0;
    function frame(t, dt) {
      if (dt > 0) {
        update(dt);
        const n = clamp(Math.round(dt * 120), 1, 6);
        for (let i = 0; i < n; i++) {
          const ex = [];
          const w = waveW(), amp = 0.5;
          for (const o of osc) ex.push(o.x, o.y, Math.sin(stepN * w) * amp * 0.35, 5 * kS);
          if (mover) {
            const vs = (0.2 + cfg.vsrc * 1.3) * Math.sqrt(1.75 * (0.25 + 0.75 * cfg.depth)) / 2 * cell() * 120 * dt / n;
            mover.x += vs * mover.dir;
            const v = view();
            if (mover.x > v.x1 - 40 || mover.x < v.x0 + 40) mover.dir *= -1;
            ex.push(mover.x, mover.y, Math.sin(stepN * w) * amp * 0.35, 5 * kS);
          }
          if (finger) { const d = Math.hypot(finger.dx, finger.dy); if (d > 0.3) ex.push(finger.x, finger.y, -clamp(d * 0.02, 0.02, 0.25), 7 * kS); }
          waveStep(ex);
          srcs = [];
        }
        if (finger) { finger.dx *= 0.5; finger.dy *= 0.5; }
        if (rainAt) { let k = dt * 40; while (k > 0) { if (Math.random() < k) { const a = rnd(TAU), d = Math.sqrt(Math.random()) * 140 * kS; drop(rainAt.x + Math.cos(a) * d, rainAt.y + Math.sin(a) * d, false); } k -= 1; } }
        if (label) { label.t += dt; if (label.kind === 'eau' && (rTimer += dt) > 0.4) { rTimer = 0; label.m = measure(label.x, label.y); } }
      }
      if (!pending) { pending = true; queueMicrotask(() => { pending = false; render(); }); }
    }
    function setQuality(q) {
      if (q === cfg.q) return;
      try { const old = R; R = initGL(q); cfg.q = q; old.K.lose(); paintD(); paintFloor(); } catch (e) { console.warn(e); }
    }

    if (window.FASC_DEBUG) window.FASC_DEBUG.eau = { get R() { return R; }, cfg, setScene, setExp, drop, run(n, h) { for (let i = 0; i < n; i++) frame(0, h); render(); } };

    setScene('mare');
    for (let i = 0; i < 30; i++) frame(0, 1 / 30);

    // tracé des murs à la main (outil MUR / GOMME)
    function wallAt(x0, y0, x1, y1, erase) {
      if (erase) { walls = walls.filter((w) => distSeg(x1, y1, w) > 18 * kS); }
      else walls.push({ ax: x0, ay: y0, bx: x1, by: y1, wd: 8 * kS });
      paintD();
    }
    function distSeg(x, y, w) {
      const abx = w.bx - w.ax, aby = w.by - w.ay, L2 = abx * abx + aby * aby || 1, h = clamp(((x - w.ax) * abx + (y - w.ay) * aby) / L2, 0, 1);
      return Math.hypot(x - (w.ax + abx * h), y - (w.ay + aby * h));
    }

    return {
      livePaused: true,
      frame,
      down(p) {
        const tool = env.tool;
        if (tool === 'observer') {
          const l = env.decor === false ? null : pick(p.x, p.y);
          label = l ? Object.assign(l, { t: 0 }) : { kind: 'eau', x: p.x, y: p.y, t: 0, m: measure(p.x, p.y) };
          rTimer = 0;
        } else if (tool === 'doigt') { finger = { x: p.x, y: p.y, dx: 0, dy: 0 }; addSrc(p.x, p.y, -0.4, 6 * kS); alarm(p.x, p.y, 90 * kS); }
        else if (tool === 'goutte') drop(p.x, p.y, true);
        else if (tool === 'pluie') rainAt = { x: p.x, y: p.y };
        else if (tool === 'mouche') addFly(p.x, p.y);
        else if (tool === 'nourrir') { for (let i = 0; i < 4; i++) { const x = p.x + rnd(14, -14) * kS, y = p.y + rnd(14, -14) * kS; pellets.push({ x, y, t: 0, s: rnd(9) }); addSrc(x, y, -0.25, 3 * kS); } if (snd()) au.noise(0.2, 0.05, 2500, 1, 'bandpass'); }
        else if (tool === 'mur' || tool === 'gomme') { drag = { x: p.x, y: p.y }; wallAt(p.x, p.y, p.x + 0.1, p.y, tool === 'gomme'); }
      },
      move(p) {
        if (!p.down) return;
        if (env.tool === 'doigt' && finger) { finger.dx = p.x - finger.x; finger.dy = p.y - finger.y; finger.x = p.x; finger.y = p.y; if (Math.random() < 0.1) alarm(p.x, p.y, 70 * kS); }
        else if (env.tool === 'pluie' && rainAt) { rainAt.x = p.x; rainAt.y = p.y; }
        else if ((env.tool === 'mur' || env.tool === 'gomme') && drag) {
          if (Math.hypot(p.x - drag.x, p.y - drag.y) > 6) { wallAt(drag.x, drag.y, p.x, p.y, env.tool === 'gomme'); drag = { x: p.x, y: p.y }; }
        }
      },
      up() { finger = null; rainAt = null; drag = null; },
      clear() {
        gerris = []; gyrins = []; kois = []; pads = []; flies = []; pellets = []; osc = []; line = null; mover = null; walls = []; plates.length = 0;
        weather.rain = weather.target = 0; cfg.auto = false; gust = null; label = null;
        R.K.clear(R.Wv.r); R.K.clear(R.Wv.w); paintD();
      },
      dispose() {
        if (amb) { try { amb.gg.gain.setTargetAtTime(0.0001, au.ctx.currentTime, 0.1); amb.s.stop(au.ctx.currentTime + 0.5); } catch (e) { /* rien */ } }
        R.K.lose();
      },
      ui() {
        const L = [];
        if (cfg.scene !== 'cuve') {
          L.push({ type: 'section', label: 'La mare' });
          const fed = gerris.reduce((s, g) => s + g.fed, 0);
          L.push({ type: 'note', text: `${gerris.length} gerris · ${gyrins.length} gyrins · ${kois.length} koïs · ${pads.length} nénuphars · ${flies.filter((f) => !f.gone).length} mouche${flies.length > 1 ? 's' : ''} à l’eau${fed ? ' · ' + fed + ' proie' + (fed > 1 ? 's' : '') + ' dévorée' + (fed > 1 ? 's' : '') : ''}` });
          L.push({ type: 'bar', label: 'Pluie', color: '#9fd0ff', value: weather.rain, txt: weather.rain < 0.03 ? 'aucune' : Math.round(weather.rain * 100) + ' %' });
          L.push({ type: 'buttons', items: [
            { label: weather.target > 0 ? 'Arrêter l’averse' : 'Averse', act: () => { weather.target = weather.target > 0 ? 0 : 0.8; weather.next = 30; } },
            { label: 'Risée', act: () => { const v = view(); gust = { x: v.x0 - 80, y: rnd(H * 0.8, H * 0.2), vx: rnd(120, 70) * kS, life: 8, r: 150 * kS }; } },
            { label: 'Mouche', act: () => { const v = view(); addFly(v.x0 + rnd(v.w * 0.8, v.w * 0.2), rnd(H * 0.8, H * 0.2)); } },
          ] });
          L.push({ type: 'toggle', label: 'Météo changeante (averses, risées, mouches)', value: cfg.auto, set: (x) => { cfg.auto = x; } });
        }
        L.push({ type: 'section', label: 'Scènes' });
        L.push({ type: 'buttons', items: [{ label: 'La mare', act: () => setScene('mare') }, { label: 'Averse', act: () => setScene('averse') }, { label: 'Cuve à ondes', act: () => setScene('cuve') }] });
        if (cfg.scene === 'cuve') {
          L.push({ type: 'section', label: 'Expériences de la cuve' });
          L.push({ type: 'choice', label: 'Dispositif', value: cfg.exp, set: setExp, options: [
            { id: 'deux', label: 'Deux sources' }, { id: 'fente', label: 'Fente' }, { id: 'double', label: 'Fentes de Young' },
            { id: 'refraction', label: 'Réfraction' }, { id: 'lentille', label: 'Lentille' }, { id: 'doppler', label: 'Doppler' }] });
          const lam = (2 * Math.PI / waveW()) * Math.sqrt(1.75 * (0.25 + 0.75 * cfg.depth)) / 2 * cell();
          L.push({ type: 'note', text: {
            deux: 'Deux sources en phase. Les lignes calmes (nœuds) dessinent des hyperboles : là, une crête rencontre toujours un creux.',
            fente: 'Une onde plane traverse une fente. Plus la fente est étroite devant la longueur d’onde, plus l’onde s’épanouit : c’est la diffraction.',
            double: 'L’expérience de Thomas Young (1801), avec de l’eau : derrière deux fentes, des franges alternent.',
            refraction: 'Une plaque immergée rend l’eau moins profonde : l’onde y ralentit et change de direction, comme la lumière dans du verre.',
            lentille: 'Une zone peu profonde en forme de lentille ralentit le centre de l’onde : le front se courbe et converge vers un foyer.',
            doppler: 'La source se déplace : les crêtes se resserrent devant, s’espacent derrière. Plus vite que les ondes, elle trace un sillage en V, comme un bateau.',
          }[cfg.exp] + ' Longueur d’onde ≈ ' + Math.round(lam) + ' px.' });
          L.push({ type: 'slider', label: 'Fréquence', min: 0, max: 1, step: 0.01, value: cfg.freq, fmt: (x) => (Math.round((0.12 + x * 0.32) * 120 / TAU * 10) / 10).toString().replace('.', ',') + ' Hz', set: (x) => { cfg.freq = x; } });
          if (cfg.exp !== 'refraction' && cfg.exp !== 'lentille' && cfg.exp !== 'doppler') L.push({ type: 'slider', label: cfg.exp === 'deux' ? 'Écart des sources' : 'Largeur des fentes', min: 0, max: 1, step: 0.01, value: cfg.gap, fmt: (x) => Math.round(x * 100) + ' %', set: (x) => { cfg.gap = x; setExp(cfg.exp); } });
          if (cfg.exp === 'doppler') L.push({ type: 'slider', label: 'Vitesse de la source', min: 0, max: 1, step: 0.01, value: cfg.vsrc, fmt: (x) => { const r = 0.2 + x * 1.3; return (Math.round(r * 100) / 100).toString().replace('.', ',') + ' × la vitesse des ondes' + (r > 1 ? ' · mur du son !' : ''); }, set: (x) => { cfg.vsrc = x; } });
          L.push({ type: 'toggle', label: 'Montrer l’amplitude moyenne (nœuds et ventres)', value: cfg.mean, set: (x) => { cfg.mean = x; } });
        }
        L.push({ type: 'section', label: 'L’eau' });
        if (cfg.scene !== 'cuve') L.push({ type: 'slider', label: 'Brise', min: 0, max: 1, step: 0.01, value: cfg.breeze, fmt: (x) => (x < 0.03 ? 'miroir' : x > 0.8 ? 'vent frais' : Math.round(x * 100) + ' %'), set: (x) => { cfg.breeze = x; } });

      function evap(g, k, dt, dk) {

      function step(dt, t) {

      /* rendu */
      const wearB = buf(GW, GH), chemB = buf(GW, GH);
      let wearT = 0;
      function wearPaint() {
